app = "cubs-chicken"
primary_region = "ord"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Must stay running so APScheduler can fire — free tier covers 1 always-on VM
  min_machines_running = 1

[[mounts]]
  source = "cubs_chicken_data"
  destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
